services:
  - type: web
    name: bellagio-events
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/content
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
# Free demo: filesystem is ephemeral. Requests/content can be lost on restart.
# For production use a paid persistent disk mounted at /var/data and set DATA_DIR.
